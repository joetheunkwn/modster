<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Garage — Build Planner</title>
  <meta name="description" content="Plan and track car modifications with a premium build planner." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Car Background -->
  <div class="car-bg empty" id="carBg"></div>

  <!-- App Shell -->
  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="header-logo">Garage <span>/ Build</span></div>
      </div>
      <div class="header-actions">
        <button class="header-btn" id="uploadBtn" title="Upload car image"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></button>
      </div>
    </header>

    <!-- ═══ HOME SCREEN ═══ -->
    <main class="screen active" id="screen-home">

      <!-- Empty state (no car image) -->
      <div id="uploadZone" class="upload-zone" style="display:none;">
        <div class="upload-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div>
        <div class="upload-title">Upload your car</div>
        <div class="upload-sub">Choose a photo to start building</div>
      </div>

      <!-- Build Panel -->
      <div class="build-panel" id="buildPanel">
        <div class="build-header">
          <div class="build-title">My Build</div>
          <div class="build-header-right">
            <button class="export-btn" id="exportBtn" title="Export build sheet"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export</button>
            <div class="build-count" id="buildCount">0 mods</div>
          </div>
        </div>

        <!-- Progress -->
        <div class="progress-wrap" id="progressWrap" style="display:none;">
          <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressFill" style="width:0%"></div>
          </div>
          <div class="progress-label">
            <span id="progressText">0% installed</span>
            <span id="progressNums">0 / 0</span>
          </div>
        </div>

        <!-- Category Filters -->
        <div class="filter-bar" id="filterBar"></div>

        <!-- Mod List -->
        <div class="mod-list" id="modList">
          <div class="build-empty" id="buildEmpty">
            <div class="empty-icon"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></div>
            Start your build<br>Tap + to add your first mod
          </div>
        </div>
      </div>
    </main>

    <!-- ═══ GARAGE SCREEN ═══ -->
    <main class="screen" id="screen-garage">
      <div class="garage-header">
        <div class="garage-title">Your<br><span>Garage</span></div>
      </div>

      <div id="garageContent">
        <!-- Filled dynamically -->
      </div>

      <button class="garage-upload-btn" id="garageUploadBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg> Change Car Photo
      </button>
    </main>

    <!-- Bottom Nav -->
    <nav class="bottom-nav">
      <div class="bottom-nav-inner">
        <button class="nav-item active" data-screen="home">
          <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>
          <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-screen="add">
          <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></span>
          <span class="nav-label">Add Mod</span>
        </button>
        <button class="nav-item" data-screen="garage">
          <span class="nav-icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></span>
          <span class="nav-label">Garage</span>
        </button>
      </div>
    </nav>
  </div>

  <!-- ═══ ADD MOD MODAL ═══ -->
  <div class="modal-overlay" id="addModModal">
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Add Modification</div>

      <div class="field">
        <label>Mod Name</label>
        <input type="text" id="modNameInput" placeholder="e.g. Apex ARC-8 Wheels" />
      </div>

      <div class="field">
        <label>Category</label>
        <select id="modCategoryInput">
          <option value="Wheels">Wheels</option>
          <option value="Aero">Aero</option>
          <option value="Engine">Engine</option>
          <option value="Exhaust">Exhaust</option>
          <option value="Suspension">Suspension</option>
          <option value="Brakes">Brakes</option>
          <option value="Interior">Interior</option>
          <option value="Exterior">Exterior</option>
          <option value="Lighting">Lighting</option>
          <option value="Audio">Audio</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <div class="field">
        <label>Status</label>
        <div class="status-selector" id="statusSelector">
          <div class="status-option selected" data-status="planned">
            <div class="status-dot"></div>
            <div class="status-text">Planned</div>
          </div>
          <div class="status-option" data-status="ordered">
            <div class="status-dot"></div>
            <div class="status-text">Ordered</div>
          </div>
          <div class="status-option" data-status="installed">
            <div class="status-dot"></div>
            <div class="status-text">Installed</div>
          </div>
        </div>
      </div>

      <button class="btn-save" id="saveModBtn">Save Mod</button>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelModBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- ═══ EXPORT PREVIEW MODAL ═══ -->
  <div class="modal-overlay" id="exportModal">
    <div class="modal export-modal">
      <div class="modal-handle"></div>
      <div class="modal-title">Position Your Image</div>
      <div class="export-hint">Drag to reposition</div>
      <div class="export-preview-viewport" id="exportViewport">
        <img id="exportPreviewImg" src="" alt="Car preview" draggable="false" />
        <!-- Export template overlay -->
        <div class="export-guide">
          <div class="export-guide-gradient"></div>
          <div class="export-guide-content">
            <div class="export-guide-title">MY BUILD</div>
            <div class="export-guide-sub" id="exportGuideSub">0 mods</div>
            <div class="export-guide-divider"></div>
            <div class="export-guide-mods" id="exportGuideMods"></div>
            <div class="export-guide-footer">
              <span>BUILT WITH GARAGE</span>
              <span id="exportGuideDate"></span>
            </div>
          </div>
        </div>
      </div>
      <button class="btn-save" id="generateExportBtn">Generate Build Sheet</button>
      <div class="modal-actions">
        <button class="btn-cancel" id="cancelExportBtn">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Hidden file input -->
  <input type="file" id="fileInput" accept="image/*" style="display:none;" />

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
